[LIGHT_HEADLIGHTS]
COLOR=255,254,253,0.05
POPUP_ENABLED=1
POSITION=-0.0, 0.58, 2.3        ; position, relative to car, without X component
MIRROR=0.68                  ; and here is X: if non-zero, lights merge with distance
DIRECTION=0,-0.2, 1          ; direction for spotlight
RANGE_FIRSTPERSON=490.0       ; range when car is close to camera
RANGE_CARS_NEARBY=50.0        ; range when car is nearby, to avoid blinding
RANGE_CARS_DISTANT=190.0      ; range when car is far away
RANGE_GRADIENT_OFFSET=0.0     ; increase to move gradient further from the camera
FADE_FROM=740.0               ; when to fade until full deactivation, from
FADE_TO=990.0                 ; when to fade, to
SPOT=90.0                     ; angle of spotlight, in degress
SPOT_SHARPNESS=0.7           ; how sharp should be spotlight
SPOT_EDGE=0.14, 0.14, 0.14    ; at what point of vertical axis (0–1, where 1 is fully vertical), light should stop
                              ; three numbers are for three color channels, for cheap chromatic abberations effect
SPOT_EDGE_SHARPNESS=2.0      ; how sharp should be this limitation
SECOND_SPOT=149.0             ; second spotlight, to lit up areas nearby
SECOND_SPOT_SHARPNESS=0.1     ; how sharp second spotlight should be
SECOND_SPOT_SKIP=0.2         ; that’s the cheapest move, but you can make it ignore areas nearby to kind of imitate shadows
SECOND_SPOT_RANGE=25.0        ; range of second spotlight
SECOND_SPOT_INTENSITY=0.9    ; intensity of second spotlight
RELATIVE_TO=

[LIGHT_BRAKES]
COLOR=2, 0, 0, 3
POSITION=0, 0.4, -1.8 
DIRECTION=0, -0.5, -1
MIRROR=0.5
SELF_LIGHTNING=1
RANGE_FIRSTPERSON=3.0
RANGE_CARS_NEARBY=2.0
RANGE_CARS_DISTANT=7.0
RANGE_GRADIENT_OFFSET=0.5
FADE_FROM=150.0
FADE_TO=180.0
SPOT=150
SPOT_SHARPNESS=0.2
SPOT_EDGE=0.0, 1.0, 1.0
SPOT_EDGE_SHARPNESS=1.5
BRAKELIGHT_LIGHT_MULT=0.2         ; how bright should be brakelight in headlights role
BRAKELIGHT_LIGHT_RANGE_MULT=0.5   ; distance multiplier
BRAKELIGHT_LIGHT_FADE_MULT=0.7    ; how faster it should fade with distance in headlighs role	

