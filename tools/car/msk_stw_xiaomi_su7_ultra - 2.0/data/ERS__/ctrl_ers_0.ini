[HEADER]
NAME=运动

[CONTROLLER_0]
COMBINATOR=ADD 							; COMBINATOR MODE: ADD or MULT
INPUT=GAS								; telemetry channel input. SLIPRATIO_MAX SLIPRATIO_AVG LONG LATG BRAKE0-1 GAS0-1 STEER-1+1 SPEEDKMH GEAR
LUT=kers_gas_fwd.lut						; input data to kers delivery lookup table
FILTER=0.5								; filter for eliminating spikes in variations and control variation speed
UP_LIMIT=1.0								; kers delivery max limit
DOWN_LIMIT=0							; kers delivery min limit (can be negative)

[CONTROLLER_1]
INPUT=GEAR
COMBINATOR=MULT
LUT=(-1=-1|0=0|1=1)
FILTER=0.96
UP_LIMIT=1.0
DOWN_LIMIT=0.0	

[CONTROLLER_2]
INPUT=SPEED_KMH	
COMBINATOR=MULT
LUT=(0=1|359.6=1|233.6=0)
FILTER=0.992
UP_LIMIT=1.0
DOWN_LIMIT=0.0	

[CONTROLLER_3]
INPUT=REAR_AXLE_DIFFERENCE_ABSOLUTE
COMBINATOR=MULT
LUT=(0=1|80=1|120=0.1)
FILTER=0.96
UP_LIMIT=1.0
DOWN_LIMIT=0.0	