[HEADER]
VERSION=2

[_EXTENSION]
TORQUE_MODE_EX=2
FIX_PROGRESSIVE_RATE=1

[BASIC]
WHEELBASE=3					; Wheelbase distance in meters
CG_LOCATION=0.49				; Front Weight distribution in percentance

[ARB]
FRONT=60000							; Front antiroll bar stifness. in Nm
REAR=28000								; Rear antiroll bar stifness. in Nm

[FRONT]
TYPE=DWB								; DWB , STRUT
BASEY=-0.05							; Distance of CG from the center of the wheel in meters. Front Wheel Radius+BASEY=front CoG. Actual CG height =(FWR+FBasey)+(RWR+Rbasey))/CG_LOCATION%
TRACK=1.703							; Track width in meters (from pivot 3D placement of the 3d model of a wheel)
ROD_LENGTH=0.038				; push rod length in meters. positive raises ride height, negative lowers ride height.
HUB_MASS=39							; masse sospese anteriori
RIM_OFFSET=0.0
WBCAR_TOP_FRONT=0.358,0.2285,0.1191
WBCAR_TOP_REAR=0.365,0.1772,-0.1137
WBCAR_BOTTOM_FRONT=0.4155,-0.1975,0.2958
WBCAR_BOTTOM_REAR=0.4927,-0.1812,-0.0075
WBTYRE_TOP=0.098,0.1948,-0.04817
WBTYRE_BOTTOM=0.0499,-0.1938,0.0008
WBCAR_STEER=0.462,-0.1355,0.09230
WBTYRE_STEER=0.0304,-0.1436,0.1110
TOE_OUT=-0.0000
STATIC_CAMBER=-3.3
SPRING_RATE=135000						; Wheel rate stifness in Nm. Do not use spring value but calculate wheel rate
PROGRESSIVE_SPRING_RATE=18000			; progressive spring rate in N/m/m
BUMP_STOP_RATE=200000						; bump stop spring rate
BUMPSTOP_UP=0.045						; meters to upper bumpstop from the 0 design of the suspension
BUMPSTOP_DN=0.080						; meters to bottom bumpstop from the 0 design of the suspension
PACKER_RANGE=0.050						; Total suspension movement range, before hitting packers
DAMP_BUMP=17000
DAMP_FAST_BUMP=4500	
DAMP_FAST_BUMPTHRESHOLD=0.090						
DAMP_REBOUND=16500
DAMP_FAST_REBOUND=6000	
DAMP_FAST_REBOUNDTHRESHOLD=0.130

[REAR]
TYPE=DWB
BASEY=-0.05									; Distance of CG from the center of the wheel in meters. Rear Wheel Radius-BASEY=Rear CoG  Actual CG height =(FWR-FBasey)+(RWR-Rbasey))/CG_LOCATION%
TRACK=1.719
ROD_LENGTH=0.038						
HUB_MASS=55
RIM_OFFSET=0.045	
WBCAR_TOP_FRONT=0.45028, 0.10705, 0.26370
WBCAR_TOP_REAR=0.41895, 0.11103, -0.21603
WBCAR_BOTTOM_FRONT=0.45241, -0.13704, 0.25301
WBCAR_BOTTOM_REAR=0.52752, -0.15959, -0.21499
WBTYRE_TOP=0.09214, 0.09412, -0.03682
WBTYRE_BOTTOM=0.07903, -0.19200, -0.07547
WBCAR_STEER=0.52752, -0.08479, -0.20301
WBTYRE_STEER=0.07903, -0.11450, -0.10484
TOE_OUT=0.0001
STATIC_CAMBER=-2.7
SPRING_RATE=145000
PROGRESSIVE_SPRING_RATE=60000
BUMP_STOP_RATE=200000
BUMPSTOP_UP=0.040
BUMPSTOP_DN=0.100
PACKER_RANGE=0.055
DAMP_BUMP=11000
DAMP_FAST_BUMP=4500	
DAMP_FAST_BUMPTHRESHOLD=0.090						
DAMP_REBOUND=17500
DAMP_FAST_REBOUND=6500	
DAMP_FAST_REBOUNDTHRESHOLD=0.130				


[GRAPHICS_OFFSETS]
WHEEL_LF=-0.01					;Left front graphical offset of the wheel positioning in the x axis (width). + is left - is right movement
SUSP_LF=-0.01			;Left front graphical offset of the suspension positioning in the x axis (width). + is left - is right movement
WHEEL_RF=0.01				; Right front as above
SUSP_RF=0.01	; Right front as above
WHEEL_LR=0.01				; Left rear as above
SUSP_LR=0.01					; Left rear as above
WHEEL_RR=-0.01			; Right rear as above
SUSP_RR=-0.01		; Right rear as above

[DAMAGE]
MIN_VELOCITY=40				; MINUMUM VELOCITY TO START TAKING DAMAGE
GAIN=0.0004					; AMOUNT OF STEER ROD DEFLECTION FOR IMPACT KMH
MAX_DAMAGE=0.05			; MAXIMUM AMOUNT OF STEER ROD DEFLECTION ALLOWED
DEBUG_LOG=1					; ACTIVATES DAMAGE DEBUG IN THE LOG

