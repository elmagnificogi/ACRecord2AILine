[HEADER]
VERSION=2

[_EXTENSION]
ENABLE=1
USE_ADVANCED_SYSTEM=0 ;Only heating

[DATA]
MAX_TORQUE=4650
FRONT_SHARE=0.64
HANDBRAKE_TORQUE=1000
COCKPIT_ADJUSTABLE=0
ADJUST_STEP=0.5

[TEMPS_FRONT]
COOL_TRANSFER=0.0030   							;how fast heat transfers from the surface to the air (independent of speed)
TORQUE_K=0.54
PERF_CURVE=brakes_tcurve_front.lut    	;now functions as a celsius|friction coefficient lookup table
COOL_SPEED_FACTOR=0.0030    					;speed-based air cooling contributed by ducting
CORE_TRANSFER_IN=0.050    						;how fast heat from the surface transfers to the core
CORE_TRANSFER_OUT=0.800    						;how fast heat from the core transfers to the surface
CORE_TRANSFER_AIR=0.0005    					;how fast heat from the core transfers to the air

[TEMPS_REAR]
COOL_TRANSFER=0.0030    							;how fast heat transfers from the surface to the air (independent of speed)
TORQUE_K=0.46
PERF_CURVE=brakes_tcurve_rear.lut    	;now functions as a celsius|friction coefficient lookup table
COOL_SPEED_FACTOR=0.0030    					;speed-based air cooling contributed by ducting
CORE_TRANSFER_IN=0.055    						;how fast heat from the surface transfers to the core
CORE_TRANSFER_OUT=0.750    						;how fast heat from the core transfers to the surface
CORE_TRANSFER_AIR=0.0005    					;how fast heat from the core transfers to the air