[HEADER]
VERSION=3

[TRACTION]
TYPE=AWD					; Wheel drive. Possible options: FWD (Front Wheel Drive), RWD (Rear Wheel Drive)

[GEARS]
COUNT=1				; forward gears number
GEAR_R=-1			; rear gear ratio ; forward gears ratios. must be equal to number of gears defined on count
GEAR_1=1.315
FINAL=7	; final gear ratio

[DIFFERENTIAL]
POWER=0.0			; differential lock under power. 1.0=100% lock - 0 0% lock
COAST=0.0			; differential lock under coasting. 1.0=100% lock 0=0% lock
PRELOAD=0			; preload torque setting

[AWD]
FRONT_SHARE=22
FRONT_DIFF_POWER=0.50
FRONT_DIFF_COAST=0.00
FRONT_DIFF_PRELOAD=10
CENTRE_DIFF_POWER=0.00
CENTRE_DIFF_COAST=0.00
CENTRE_DIFF_PRELOAD=10
REAR_DIFF_POWER=0.80
REAR_DIFF_COAST=0.00
REAR_DIFF_PRELOAD=10

[GEARBOX]
CHANGE_UP_TIME=1		; change up time in milliseconds
CHANGE_DN_TIME=1		; change down time in milliseconds
AUTO_CUTOFF_TIME=1		; Auto cutoff time for upshifts in milliseconds, 0 to disable
SUPPORTS_SHIFTER=0		; 1=Car supports shifter, 0=car supports only paddles 
VALID_SHIFT_RPM_WINDOW=800			;range window additional to the precise rev matching rpm that permits gear engage.
CONTROLS_WINDOW_GAIN=0.4			;multiplayer for gas,brake,clutch pedals that permits gear engage on different rev matching rpm. the lower the more difficult.
INERTIA=0.022			; gearbox inertia. default values to 0.02 if not set

[CLUTCH]
MAX_TORQUE=2000

[AUTOCLUTCH]
UPSHIFT_PROFILE=NONE			; Name of the autoclutch profile for upshifts. NONE to disable autoclutch on shift up
DOWNSHIFT_PROFILE=DOWNSHIFT_PROFILE	; Same as above for downshifts
USE_ON_CHANGES=0				; Use the autoclutch on gear shifts even when autoclutch is set to off. Needed for cars with semiautomatic gearboxes. values 1,0
MIN_RPM=0					; Minimum rpm for autoclutch engadgement
MAX_RPM=0					; Maximum rpm for autoclutch engadgement
FORCED_ON=0

[DOWNSHIFT_PROFILE]
POINT_0=50				; Time to reach fully depress clutch
POINT_1=180				; Time to start releasing clutch
POINT_2=1500				; Time to reach fully released clutch

[DAMAGE]
RPM_WINDOW_K=24000

